# .github/workflows/release.yml
name: Release Geode Mod

on:
  workflow_run:
    workflows: ["Build Geode Mod"]
    types: [completed]

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read mod version from mod.json
        id: mod-version
        shell: bash
        run: |
          if [ ! -f mod.json ]; then
            echo "mod.json not found" >&2
            exit 1
          fi

          VERSION="$(python -c "import json; print(json.load(open('mod.json'))['version'])")"

          if [ -z "$VERSION" ]; then
            echo "mod.json version is empty" >&2
            exit 1
          fi

          TAG="v$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag if missing
        env:
          TAG: ${{ steps.mod-version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists"
          else
            git tag "${TAG}"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "refs/tags/${TAG}"
            echo "Pushed tag ${TAG}"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.mod-version.outputs.tag }}
          name: ${{ steps.mod-version.outputs.tag }}
          body: |
            Release ${{ steps.mod-version.outputs.tag }}
            Built from workflow run: ${{ github.event.workflow_run.html_url }}
          draft: false
          prerelease: false
