name: Release Geode Mod

on:
  workflow_run:
    workflows: ["Build Geode Mod"]
    types: [completed]

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download build artifacts from build workflow run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          OWNER_REPO="${{ github.repository }}"
          RUN_ID="${{ github.event.workflow_run.id }}"

          echo "Looking up artifacts for run $RUN_ID in $OWNER_REPO"
          ARTIFACTS_JSON=$(curl -sSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER_REPO}/actions/runs/${RUN_ID}/artifacts")

          echo "$ARTIFACTS_JSON" | jq '.artifacts' || true

          ARTIFACT_ID=$(echo "$ARTIFACTS_JSON" | jq -r '.artifacts[] | select(.name=="build-output") | .id' | head -n 1)

          if [ -z "${ARTIFACT_ID}" ] || [ "${ARTIFACT_ID}" = "null" ]; then
            echo "No build-output artifact found for run $RUN_ID"
            exit 1
          fi

          echo "Downloading artifact id: ${ARTIFACT_ID}"
          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${OWNER_REPO}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o artifact.zip

          mkdir -p artifacts
          unzip -o artifact.zip -d artifacts

          find artifacts -type f -name '*.geode' -exec mv -f {} artifacts/ \;

          echo "Release artifact files:"
          ls -la artifacts || true

          if ! find artifacts -maxdepth 1 -type f -name '*.geode' | grep -q .; then
            echo "No .geode file available to release."
            exit 1
          fi

      - name: Read mod version from mod.json
        id: mod-version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import json
          with open('mod.json') as f:
              print(json.load(f)['version'])
          PY
          )"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag if missing
        env:
          TAG: ${{ steps.mod-version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists"
          else
            git tag "${TAG}"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "refs/tags/${TAG}"
          fi

      - name: Create GitHub release and upload built artifact(s)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.mod-version.outputs.tag }}
          name: ${{ steps.mod-version.outputs.tag }}
          files: |
            ./artifacts/*.geode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
