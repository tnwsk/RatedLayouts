name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            build-type: RelWithDebInfo
          - name: macOS
            os: macos-latest
          - name: iOS
            os: macos-latest
            target: iOS
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Compile the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          cli: '3.8.0'
          export-pdb: true
          export-symbols: true
          target: ${{ matrix.config.target }}
          build-config: ${{ matrix.config.build-type || 'Release' }}

  package:
    name: Package Builds
    runs-on: ubuntu-latest
    needs: ["build"]

    steps:
      - uses: actions/checkout@v6

      - name: Combine geode outputs
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Prepare final package directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          if [ -n "${{ steps.build.outputs.build-output }}" ]; then
            echo "Using combine output: ${{ steps.build.outputs.build-output }}"
            cp -R "${{ steps.build.outputs.build-output }}"/* artifacts/ || true
          fi

          find . -type f -name "*.geode" -exec cp -f {} artifacts/ \; || true

          echo "Artifacts in package job:"
          ls -la artifacts || true

          if ! find artifacts -maxdepth 1 -type f -name '*.geode' | grep -q .; then
            echo "No .geode package generated."
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: artifacts/
          if-no-files-found: error
